<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EE Calculator</title>
    <!-- KaTeX CSS for math rendering -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <!-- Pre-paint theme & accent initializer to prevent flash -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem("ee_theme") || "system";
          const resolvedTheme = theme === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          if (resolvedTheme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          const accent = localStorage.getItem("ee_accent") || "blue";
          document.documentElement.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
